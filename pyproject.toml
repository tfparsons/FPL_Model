[project]
name = "mudchute"
version = "0.1.0"
description = "FPL transfer optimisation for Real Mudchute: xP engine + multi-period MILP solver"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=2.0",
    "highspy>=1.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mudchute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
